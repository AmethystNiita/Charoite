<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Charoite</title>

  <style>
    :root {
      --bg: #17121f;
      --bar: #241a31;
      --bar-light: #30233f;
      --purple: #9d7ac7;
      --purple-light: #c8a9ed;
      --text: #eee5f8;

      --page: #211a29;
      --page-text: #eee5f8;
      --page-border: #3c2c4b;

      --shadow: rgba(0, 0, 0, 0.35);

      --ui-font:
        "Segoe UI",
        -apple-system,
        BlinkMacSystemFont,
        "San Francisco",
        "Roboto",
        "Noto Sans",
        "Liberation Sans",
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .editor-content, textarea, [contenteditable="true"] {
      user-select: text;
      -webkit-user-select: text;
    }

    .titlebar {
      data-tauri-drag-region: true;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 48px;
      min-height: 48px;

      background: var(--bar);

      border-bottom: 1px solid #3c2b4c;

      display: flex;
      align-items: center;

      padding: 0 12px;
      gap: 4px;

      box-shadow: 0 3px 12px var(--shadow);

      z-index: 10;
    }

    .menu {
      position: relative;
    }

    .menu-button {
      border: 0;
      background: transparent;

      color: var(--text);

      padding: 8px 12px;

      border-radius: 7px;

      font-family: var(--ui-font);
      font-size: 14px;

      cursor: pointer;
    }

    .menu-button:hover,
    .menu-button.active {
      background: var(--bar-light);
      color: var(--purple-light);
    }

    .dropdown {
      position: absolute;

      top: 40px;
      left: 0;

      min-width: 190px;

      background: #21172c;

      border: 1px solid #49345d;
      border-radius: 9px;

      padding: 6px;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.4);

      display: none;

      z-index: 50;
    }

    .dropdown.show {
      display: block;
    }

    .submenu {
      position: relative;
    }

    .submenu > button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .submenu-arrow {
      margin-left: 18px;
      opacity: 0.75;
    }

    .submenu-menu {
      position: absolute;
      top: -6px;
      left: 100%;
      min-width: 130px;
      background: #21172c;
      border: 1px solid #49345d;
      border-radius: 9px;
      padding: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 60;
    }

    .submenu:hover .submenu-menu,
    .submenu:focus-within .submenu-menu {
      display: block;
    }

    .dropdown button,
    .font-size-control {
      width: 100%;

      border: 0;
      background: transparent;

      color: var(--text);

      padding: 9px 10px;

      border-radius: 6px;

      font-family: var(--ui-font);
      font-size: 14px;

      text-align: left;

      cursor: pointer;
    }

    .dropdown button:hover {
      background: var(--bar-light);
      color: var(--purple-light);
    }

    .separator {
      height: 1px;
      background: #49345d;
      margin: 5px 4px;
    }

    .font-size-control {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: default;
    }

    .font-size-control input {
      width: 65px;

      margin-left: auto;

      background: #17121f;

      border: 1px solid #4a365b;
      border-radius: 5px;

      color: var(--text);

      padding: 4px 6px;

      outline: none;

      font-family: var(--ui-font);
    }

    .font-size-control input:focus {
      border-color: var(--purple);
    }

    .document-name {
      margin-left: auto;

      width: 220px;

      background: #1b1424;

      border: 1px solid #443152;

      color: var(--text);

      border-radius: 7px;

      padding: 7px 10px;

      outline: none;

      font-family: var(--ui-font);
      font-size: 14px;
    }

    .document-name:focus {
      border-color: var(--purple);

      box-shadow:
        0 0 0 2px rgba(157, 122, 199, 0.12);
    }

    .workspace {
      flex: 1;

      overflow: auto;

      padding: 28px;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .page {
      width: 100%;

      min-height: calc(100vh - 104px);

      background: var(--page);
      color: var(--page-text);

      padding: 38px 40px;

      border: 1px solid var(--page-border);

      border-radius: 2px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(255, 255, 255, 0.025);

      outline: none;

      font-family: var(--ui-font);
      font-size: 16px;
      line-height: 1.65;

      overflow-wrap: break-word;
      white-space: pre-wrap;

      spellcheck: false;
    }

    .page:focus {
      border-color: #59416d;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(157, 122, 199, 0.25);
    }

    .page:empty::before {
      content: "";
      color: #83768d;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .workspace {
        padding: 12px;
      }

      .page {
        padding: 30px 28px;
      }

      .document-name {
        width: 140px;
      }
    }
  </style>

</head>

<body>

  <div class="topbar">


    <div class="menu">
      <button
        class="menu-button"
        id="fileButton"
      >
        file
      </button>

      <div
        class="dropdown"
        id="fileMenu"
      >

        <button id="newButton">
          new
        </button>

        <button id="loadButton">
          load
        </button>

        <button id="saveButton">
          save
        </button>

        <div class="separator"></div>

        <button id="importButton">
          import
        </button>

        <div class="submenu">
          <button id="exportButton">
            export <span class="submenu-arrow">▸</span>
          </button>

          <div class="submenu-menu" id="exportMenu">
            <button id="exportTxtButton">
              as .txt
            </button>

            <button id="exportJpgButton">
              as .jpg
            </button>

            <button id="exportPngButton">
              as .png
            </button>

            <button id="exportGifButton">
              as .gif
            </button>
          </div>
        </div>

        <div class="separator"></div>

        <button id="copyButton">
          copy
        </button>

        <button id="pasteButton">
          paste
        </button>

      </div>
    </div>



    <div class="menu">
      <button
        class="menu-button"
        id="editButton"
      >
        edit
      </button>

      <div
        class="dropdown"
        id="editMenu"
      >

        <button id="fontButton">
          load font
        </button>

        <label class="font-size-control">
          font size

          <input
            id="fontSizeInput"
            type="number"
            min="6"
            max="200"
            value="16"
            spellcheck="false"
            autocomplete="off"
          >
        </label>

        <div class="separator"></div>

        <button id="boldButton">
          bold
        </button>

        <button id="italicButton">
          italic
        </button>

        <button id="underlineButton">
          underline
        </button>

      </div>
    </div>



    <input
      id="loadInput"
      type="file"
      accept=".charoite,application/x-charoite"
      hidden
    >


    <input
      id="importInput"
      type="file"
      accept=".txt,text/plain"
      hidden
    >

    <input
      id="fontInput"
      type="file"
      accept=".ttf,.otf,.woff,.woff2"
      hidden
    >



    <input
      id="documentName"
      class="document-name"
      type="text"
      value="untitled"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      aria-label="document name"
    >

  </div>



  <main class="workspace">

    <div
      id="page"
      class="page"
      contenteditable="true"
      spellcheck="false"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      data-gramm="false"
      data-gramm_editor="false"
      data-enable-grammarly="false"
    ></div>

  </main>


  <script>
    const STORAGE_KEY =
      "charoite-document";

    const page =
      document.getElementById("page");

    const fileButton =
      document.getElementById("fileButton");

    const editButton =
      document.getElementById("editButton");

    const fileMenu =
      document.getElementById("fileMenu");

    const editMenu =
      document.getElementById("editMenu");

    const newButton =
      document.getElementById("newButton");

    const loadButton =
      document.getElementById("loadButton");

    const saveButton =
      document.getElementById("saveButton");

    const importButton =
      document.getElementById("importButton");

    const exportButton =
      document.getElementById("exportButton");

    const exportTxtButton =
      document.getElementById("exportTxtButton");

    const exportJpgButton =
      document.getElementById("exportJpgButton");

    const exportPngButton =
      document.getElementById("exportPngButton");

    const exportGifButton =
      document.getElementById("exportGifButton");

    const copyButton =
      document.getElementById("copyButton");

    const pasteButton =
      document.getElementById("pasteButton");

    const fontButton =
      document.getElementById("fontButton");

    const loadInput =
      document.getElementById("loadInput");

    const importInput =
      document.getElementById("importInput");

    const fontInput =
      document.getElementById("fontInput");

    const fontSizeInput =
      document.getElementById("fontSizeInput");

    const boldButton =
      document.getElementById("boldButton");

    const italicButton =
      document.getElementById("italicButton");

    const underlineButton =
      document.getElementById("underlineButton");

    const documentName =
      document.getElementById("documentName");


    let customFontName = null;
    let customFontData = null;



    function saveState() {

      const state = {
        content: page.innerHTML,
        name: documentName.value,
        fontSize:
          page.style.fontSize || "16px",
        customFontName:
          customFontName,
        customFontData:
          customFontData
      };

      try {

        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(state)
        );

      } catch {

        try {

          const smallerState = {
            content: page.innerHTML,
            name: documentName.value,
            fontSize:
              page.style.fontSize || "16px",
            customFontName: null,
            customFontData: null
          };

          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(smallerState)
          );

        } catch {
        }
      }
    }


    function loadState() {

      const saved =
        localStorage.getItem(
          STORAGE_KEY
        );

      if (!saved) {
        return;
      }

      try {

        const state =
          JSON.parse(saved);

        page.innerHTML =
          state.content || "";

        documentName.value =
          state.name || "untitled";

        page.style.fontSize =
          state.fontSize || "16px";

        fontSizeInput.value =
          parseInt(
            state.fontSize || "16",
            10
          );


        updateTextDirection();

        if (
          state.customFontName &&
          state.customFontData
        ) {

          installCustomFont(
            state.customFontName,
            state.customFontData
          );
        }

      } catch {
      }
    }



    function closeMenus() {

      fileMenu.classList.remove("show");
      editMenu.classList.remove("show");

      fileButton.classList.remove("active");
      editButton.classList.remove("active");
    }


    fileButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const wasOpen =
          fileMenu.classList.contains(
            "show"
          );

        closeMenus();

        if (!wasOpen) {

          fileMenu.classList.add("show");
          fileButton.classList.add("active");

        }
      }
    );

    editButton.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const wasOpen =
          editMenu.classList.contains(
            "show"
          );

        closeMenus();

        if (!wasOpen) {

          editMenu.classList.add("show");
          editButton.classList.add("active");

        }
      }
    );


    document.addEventListener(
      "click",
      closeMenus
    );


    fileMenu.addEventListener(
      "click",
      event => event.stopPropagation()
    );


    editMenu.addEventListener(
      "click",
      event => event.stopPropagation()
    );



    newButton.addEventListener(
      "click",
      function() {

        page.innerHTML = "";

        documentName.value =
          "untitled";

        page.style.fontSize =
          "16px";

        page.innerHTML = "";
        page.dir = "ltr";

        fontSizeInput.value =
          "16";


        customFontName = null;
        customFontData = null;


        const oldStyle =
          document.getElementById(
            "custom-font-style"
          );

        if (oldStyle) {
          oldStyle.remove();
        }


        page.style.fontFamily = "";


        localStorage.removeItem(
          STORAGE_KEY
        );


        page.focus();

        closeMenus();
      }
    );




    function getNodeFormatting(node) {
      const formatting = {
        bold: false,
        italic: false,
        underline: false
      };

      let current = node.parentElement;

      while (current && current !== page) {
        const tag = current.tagName.toLowerCase();

        if (tag === "b" || tag === "strong") {
          formatting.bold = true;
        }

        if (tag === "i" || tag === "em") {
          formatting.italic = true;
        }

        if (tag === "u") {
          formatting.underline = true;
        }

        current = current.parentElement;
      }

      return formatting;
    }

    function escapeCharoiteText(text) {
      return text
        .replace(/\\/g, "\\\\")
        .replace(/\*/g, "\\*")
        .replace(/_/g, "\\_");
    }

    function formattingPrefix(formatting) {
      if (
        formatting.bold &&
        formatting.italic &&
        formatting.underline
      ) {
        return "__***";
      }

      if (
        formatting.bold &&
        formatting.underline
      ) {
        return "__**";
      }

      if (
        formatting.italic &&
        formatting.underline
      ) {
        return "__*";
      }

      if (
        formatting.bold &&
        formatting.italic
      ) {
        return "***";
      }

      if (formatting.bold) {
        return "**";
      }

      if (formatting.italic) {
        return "*";
      }

      if (formatting.underline) {
        return "__";
      }

      return "";
    }

    function formattingSuffix(formatting) {
      if (
        formatting.bold &&
        formatting.italic &&
        formatting.underline
      ) {
        return "***__";
      }

      if (
        formatting.bold &&
        formatting.underline
      ) {
        return "**__";
      }

      if (
        formatting.italic &&
        formatting.underline
      ) {
        return "*__";
      }

      if (
        formatting.bold &&
        formatting.italic
      ) {
        return "***";
      }

      if (formatting.bold) {
        return "**";
      }

      if (formatting.italic) {
        return "*";
      }

      if (formatting.underline) {
        return "__";
      }

      return "";
    }

    function getEmbeddedFontInfo() {
      if (!customFontData) {
        return null;
      }

      const match = customFontData.match(
        /^data:([^;,]+);base64,([A-Za-z0-9+/=]+)$/
      );

      if (!match) {
        return null;
      }

      return {
        mime: match[1],
        base64: match[2]
      };
    }

    function charoiteFromDom() {
      const blockTags = new Set([
        "div", "p", "li", "blockquote", "pre",
        "h1", "h2", "h3", "h4", "h5", "h6"
      ]);

      function imageToken(node) {
        const src = node.getAttribute("src") || "";
        const width = Math.round(
          node.getBoundingClientRect().width || node.width || 0
        );
        const height = Math.round(
          node.getBoundingClientRect().height || node.height || 0
        );

        const match = src.match(
          /^data:(image\/[A-Za-z0-9.+-]+);base64,([A-Za-z0-9+/=]+)$/i
        );

        if (!match) {
          return "";
        }

        return (
          '[image="' +
          match[1].split("/")[1].toLowerCase() +
          '", width="' +
          Math.max(1, width) +
          '", height="' +
          Math.max(1, height) +
          '", base64="' +
          match[2] +
          '"]'
        );
      }

      function serializeInline(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = escapeCharoiteText(node.nodeValue);

          if (!text) {
            return "";
          }

          const formatting = getNodeFormatting(node);

          return (
            formattingPrefix(formatting) +
            text +
            formattingSuffix(formatting)
          );
        }

        if (node.nodeType !== Node.ELEMENT_NODE) {
          return "";
        }

        const tag = node.tagName.toLowerCase();

        if (tag === "br") {
          return "\n";
        }

        if (tag === "img") {
          return imageToken(node);
        }

        if (blockTags.has(tag)) {
          return serializeBlock(node);
        }

        let output = "";

        for (const child of node.childNodes) {
          output += serializeInline(child);
        }

        return output;
      }

      function serializeBlock(node) {
        let output = "";

        for (const child of node.childNodes) {
          if (
            child.nodeType === Node.ELEMENT_NODE &&
            blockTags.has(child.tagName.toLowerCase())
          ) {
            const childText = serializeBlock(child);

            if (output && !output.endsWith("\n")) {
              output += "\n";
            }

            output += childText;
          } else {
            output += serializeInline(child);
          }
        }

        return output;
      }

      let output = "";
      let pendingInline = "";

      function flushInline() {
        if (pendingInline) {
          output += pendingInline;
          pendingInline = "";
        }
      }

      for (const child of page.childNodes) {
        if (
          child.nodeType === Node.ELEMENT_NODE &&
          blockTags.has(child.tagName.toLowerCase())
        ) {
          flushInline();

          const blockText = serializeBlock(child);

          if (output && !output.endsWith("\n")) {
            output += "\n";
          }

          output += blockText;
        } else {
          pendingInline += serializeInline(child);
        }
      }

      flushInline();

      return output;
    }

function escapeHeaderValue(value) {
  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"');
}

function parseCharoiteHeader(line) {
  const match =
    line.match(/^\s*\[(.*)\]\s*$/);

  if (!match) {
    return null;
  }

  const attributes = {};

  const attributePattern =
    /([A-Za-z0-9_-]+)\s*=\s*"((?:\\.|[^"])*)"/g;

  let attributeMatch;

  while (
    (attributeMatch =
      attributePattern.exec(match[1])) !== null
  ) {
    const key =
      attributeMatch[1];

    const value =
      attributeMatch[2].replace(
        /\\(["\\])/g,
        "$1"
      );

    attributes[key] = value;
  }

  return attributes;
}


function makeCharoiteFile() {
  const font =
    getEmbeddedFontInfo();

  const content =
    charoiteFromDom();

  const fontSize =
    parseInt(page.style.fontSize || "16", 10) || 16;

  let header =
    '[file="charoite", font-size="' +
    fontSize +
    '"';

  if (font) {
    header +=
      ', font-mime="' +
      escapeHeaderValue(font.mime) +
      '"';

    header +=
      ', font-base64="' +
      escapeHeaderValue(font.base64) +
      '"';
  }

  header += "]";

  return (
    header +
    "\n\n" +
    content
  );
}

    function plainTextFromDom() {
      return page.innerText.replace(/\u00a0/g, " ");
    }

    function getStrongTextDirection(text) {
      let rtl = 0;
      let ltr = 0;

      for (const char of text) {
        const code = char.codePointAt(0);

        if (
          (code >= 0x0590 && code <= 0x08ff) ||
          (code >= 0xfb1d && code <= 0xfdff) ||
          (code >= 0xfe70 && code <= 0xfefc)
        ) {
          rtl++;
          continue;
        }

        if (
          (code >= 0x0041 && code <= 0x005a) ||
          (code >= 0x0061 && code <= 0x007a) ||
          (code >= 0x00c0 && code <= 0x02af) ||
          (code >= 0x0370 && code <= 0x058f) ||
          (code >= 0x0900 && code <= 0xd7ff) ||
          (code >= 0xf900 && code <= 0xfaff) ||
          (code >= 0xff21 && code <= 0xff3a) ||
          (code >= 0xff41 && code <= 0xff5a)
        ) {
          ltr++;
        }
      }

      if (!rtl && !ltr) {
        return "ltr";
      }

      if (rtl > ltr) {
        return "rtl";
      }

      if (ltr > rtl) {
        return "ltr";
      }

      return null;
    }

    function updateTextDirection() {
        const direction =
          getStrongTextDirection(page.innerText);

        page.dir = direction || "ltr";
      }

    async function saveTextFile(text, filename) {
      const blob = new Blob(
        [text],
        { type: "text/plain;charset=utf-8" }
      );

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [
              {
                description: filename.toLowerCase().endsWith(".charoite")
                  ? "Charoite file"
                  : "Text file",
                accept: filename.toLowerCase().endsWith(".charoite")
                  ? {
                      "application/x-charoite": [".charoite"]
                    }
                  : {
                      "text/plain": [".txt"]
                    }
              }

          close: "***__",

        {
          open: "__**",
          close: "**__",
          tags: ["u", "strong"]
        },
        {
          open: "__*",
          close: "*__",
          tags: ["u", "em"]
        },
        {
          open: "***",
          close: "***",
          tags: ["strong", "em"]
        },
        {
          open: "**",
          close: "**",
          tags: ["strong"]
        },
        {
          open: "__",
          close: "__",
          tags: ["u"]
        },
        {

          close: "*",
          tags: ["em"]

                  imageInfo.height,

                  source,
                  pattern.close,

            i++;

            container,
            source,
            i + matched.pattern.open.length,
            matched.closeIndex

            matched.closeIndex +
            matched.pattern.close.length;

function loadCharoite(text) {

  text = text.replace(/\r\n?/g, "\n");

  const firstNewline =
    text.indexOf("\n");

  if (firstNewline === -1) {
    page.textContent = text;
    return;
  }

  const headerLine =
    text
      .slice(0, firstNewline)
      .replace(/\r$/, "");

  const attributes =
    parseCharoiteHeader(headerLine);


  if (
    !attributes ||
    attributes.file !== "charoite"
  ) {
    page.textContent = text;
    return;
  }


  let contentStart =
    firstNewline + 1;

  if (
    text.startsWith(
      "\n",
      contentStart
    )
  ) {
    contentStart += 1;
  }

  const content =
    text.slice(contentStart);


  const savedFontSize =
    parseInt(attributes["font-size"], 10);

  if (
    Number.isFinite(savedFontSize)
  ) {
    const clampedFontSize =
      Math.max(6, Math.min(200, savedFontSize));

    page.style.fontSize =
      clampedFontSize + "px";

    fontSizeInput.value =
      clampedFontSize;
  }



  const fontMime =
    attributes["font-mime"];

  const fontBase64 =
    attributes["font-base64"];

  const validBase64 =
    typeof fontBase64 === "string" &&
    fontBase64.length > 0 &&
    /^[A-Za-z0-9+/]*={0,2}$/.test(
      fontBase64
    );

  const validMime =
    typeof fontMime === "string" &&
    (
      /^font\/[A-Za-z0-9.+-]+$/i.test(
        fontMime
      ) ||
      fontMime ===
        "application/octet-stream"
    );

  if (
    validBase64 &&
    validMime
  ) {
    const dataUrl =
      "data:" +
      fontMime +
      ";base64," +
      fontBase64;

    installCustomFont(
      "luni-custom-font",
      dataUrl
    );
  } else {
    customFontName = null;
    customFontData = null;

    const oldStyle =
      document.getElementById(
        "custom-font-style"
      );

    if (oldStyle) {
      oldStyle.remove();
    }

    page.style.fontFamily = "";
  }


  page.innerHTML = "";

  page.appendChild(
    parseCharoite(content)
  );

  updateTextDirection();
}

    function lzwEncodeGif(indices, minCodeSize) {

          output.push(bitBuffer & 255);

      let codeSize;

        dictionary = new Map();

        for (let i = 0; i < clearCode; i++) {
          dictionary.set(String.fromCharCode(i), i);

        codeSize = minCodeSize + 1;

      resetDictionary();
      writeCode(clearCode, codeSize);

      let phrase = String.fromCharCode(indices[0] || 0);

      for (let i = 1; i < indices.length; i++) {
        const char = String.fromCharCode(indices[i]);
        const combined = phrase + char;

        if (dictionary.has(combined)) {
          phrase = combined;
          continue;
        }

        writeCode(dictionary.get(phrase), codeSize);

        if (nextCode < 4096) {
          dictionary.set(combined, nextCode++);

            nextCode === (1 << codeSize) &&
            codeSize < 12

      writeCode(dictionary.get(phrase), codeSize);

      writeWord(width);
      writeWord(height);

      bytes.push(0x00, 0x08);

      for (let i = 0; i < compressed.length;) {
        const length = Math.min(
          255,
          compressed.length - i
        );

        bytes.push(length);

        for (let j = 0; j < length; j++) {
          bytes.push(compressed[i + j]);
        }

        i += length;
      }

      bytes.push(0x00, 0x3B);

      return new Blob(
        [new Uint8Array(bytes)],
        { type: "image/gif" }
      );
    }

    async function exportDocumentAsImage(format) {
      const rendered =
        await renderDocumentToCanvas();

      const name =
        documentName.value.trim() || "untitled";

      const baseName =
        name.replace(
          /\.(txt|charoite|jpg|jpeg|png|gif)$/i,
          ""
        );

      if (format === "jpg") {
        const blob = await canvasToBlob(
          rendered.canvas,
          "image/jpeg",
          0.92
        );

        return saveBlob(
          blob,
          baseName + ".jpg",
          "image/jpeg"
        );
      }

      if (format === "png") {
        const blob = await canvasToBlob(
          rendered.canvas,
          "image/png"
        );

        return saveBlob(
          blob,
          baseName + ".png",
          "image/png"
        );
      }

      if (format === "gif") {
        const blob =
          makeGifBlob(rendered.canvas);

        return saveBlob(
          blob,
          baseName + ".gif",
          "image/gif"
        );
      }

      throw new Error(
        "Unsupported image export format."
      );
    }

    function handleImageExport(format) {
      exportDocumentAsImage(format)
        .then(function(saved) {
          if (saved) {
            saveState();
          }

          closeMenus();
        })
        .catch(function(error) {
          if (error && error.name !== "AbortError") {
            console.error(
              "Could not export the document as " +
              format.toUpperCase() + ":",
              error
            );
          }

          closeMenus();
        });
    }

    exportJpgButton.addEventListener(
      "click",
      function() {
        closeMenus();
        handleImageExport("jpg");
      }
    );

    exportPngButton.addEventListener(
      "click",
      function() {
        closeMenus();
        handleImageExport("png");
      }
    );

    exportGifButton.addEventListener(
      "click",
      function() {
        closeMenus();
        handleImageExport("gif");
      }
    );;

    copyButton.addEventListener(
      "click",
      async function() {

        const selection =
          window.getSelection();

        const selectedText =
          selection
            ? selection.toString()
            : "";

        try {

          await navigator.clipboard.writeText(
            selectedText || page.innerText
          );

        } catch {

          try {
            document.execCommand("copy");
          } catch {
          }
        }

        closeMenus();
      }
    );



    pasteButton.addEventListener(
      "click",
      async function() {
        page.focus();

        try {
          const clipboard = await navigator.clipboard.read();
          const imageType = clipboard
            .flatMap(function(item) { return item.types; })
            .find(function(type) { return type.startsWith("image/"); });

          if (imageType) {
            const blob = await clipboard[0].getType(imageType);
            const reader = new FileReader();

            reader.onload = function(e) {
              const image = document.createElement("img");
              image.src = e.target.result;
              image.style.maxWidth = "100%";
              image.style.height = "auto";
              image.draggable = true;
              document.execCommand("insertHTML", false, image.outerHTML);
              saveState();
            };

            reader.readAsDataURL(blob);
          } else {
            const text = await navigator.clipboard.readText();
            document.execCommand("insertText", false, text);
            updateTextDirection();
            saveState();
          }
        } catch {
        }

        closeMenus();
      }
    );


    page.addEventListener(
      "paste",
      function(event) {
        const clipboard = event.clipboardData;

        if (!clipboard) {
          return;
        }

        const imageItem = Array.from(clipboard.items).find(function(item) {
          return item.type.startsWith("image/");
        });

        if (imageItem) {
          const file = imageItem.getAsFile();

          if (!file) {
            return;
          }

          event.preventDefault();

          const reader = new FileReader();

          reader.onload = function(e) {
            const image = document.createElement("img");
            image.src = e.target.result;
            image.style.maxWidth = "100%";
            image.style.height = "auto";
            image.draggable = true;

            const selection = window.getSelection();

            if (!selection || !selection.rangeCount) {
              page.appendChild(image);
              saveState();
              return;
            }

            const range = selection.getRangeAt(0);
            range.deleteContents();
            range.insertNode(image);
            range.setStartAfter(image);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
            saveState();
          };

          reader.readAsDataURL(file);
          return;
        }

        event.preventDefault();

        const text = clipboard.getData("text/plain");

        document.execCommand(
          "insertText",
          false,
          text
        );

        updateTextDirection();
        saveState();
      }
    );


    fontButton.addEventListener(
      "click",
      function() {

        fontInput.click();

        closeMenus();
      }
    );


    fontInput.addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }


        const fontName =
          "luni-custom-font";


        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            const dataUrl = e.target.result;

            if (
              typeof dataUrl !== "string" ||
              !/^data:[^;,]+;base64,[A-Za-z0-9+/=]+$/.test(dataUrl)
            ) {
              return;
            }

            installCustomFont(
              fontName,
              dataUrl
            );

            saveState();
          };


        reader.readAsDataURL(file);

        fontInput.value = "";
      }
    );



    function installCustomFont(
      fontName,
      fontData
    ) {

      customFontName = fontName;
      customFontData = fontData;

      const oldStyle =
        document.getElementById(
          "custom-font-style"
        );

      if (oldStyle) {
        oldStyle.remove();
      }

      const style =
        document.createElement("style");

      style.id =
        "custom-font-style";

      style.textContent = `
        @font-face {
          font-family: "${fontName}";
          src: url("${fontData}");
        }

        .page {
          font-family:
            "${fontName}",
            var(--ui-font);
        }
      `;

      document.head.appendChild(style);
    }



    fontSizeInput.addEventListener(
      "input",
      function() {

        let size =
          Number(
            fontSizeInput.value
          );

        if (!size) {
          size = 16;
        }

        size =
          Math.max(
            6,
            Math.min(200, size)
          );

        page.style.fontSize =
          size + "px";

        saveState();
      }
    );



    function format(command) {

      page.focus();

      document.execCommand(
        command,
        false,
        null
      );

      saveState();
    }


    boldButton.addEventListener(
      "click",
      () => {
        format("bold")
        closeMenus();
      }
    );


    italicButton.addEventListener(
      "click",
      () => {
        format("italic");
        closeMenus();
      }
    );


    underlineButton.addEventListener(
      "click",
      () => {
        format("underline");
        closeMenus();
      }
    );



    page.addEventListener(
      "input",
      function() {
        updateTextDirection();
        saveState();
      }
    );


    documentName.addEventListener(
      "input",
      function() {
        saveState();
      }
    );



    document.addEventListener(
      "keydown",
      function(event) {

        if (
          !(event.ctrlKey || event.metaKey)
        ) {
          return;
        }

        const key =
          event.key.toLowerCase();


        if (key === "b") {

          event.preventDefault();

          format("bold");
        }


        if (key === "i") {

          event.preventDefault();

          format("italic");
        }


        if (key === "u") {

          event.preventDefault();

          format("underline");
        }


        if (key === "s") {

          event.preventDefault();

          saveButton.click();
        }
      }
    );

    document.addEventListener("keydown", function(event) {
      const key = event.key.toLowerCase();
      const isCmdOrCtrl = event.ctrlKey || event.metaKey;

      if (event.key.startsWith("F") && event.key.length > 1) {
        event.preventDefault();
        return;
      }

      if (isCmdOrCtrl) {
        const allowedKeys = [
          "c", "v", "x", "a", "z", "y",
          "b", "i", "u",
          "arrowleft", "arrowright", "arrowup", "arrowdown",
          "home", "end", "pageup", "pagedown", "backspace", "delete"
        ];

        if (allowedKeys.includes(key)) {
          return;
        }

        event.preventDefault();
      }
    }, true);

    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    }, true);

    document.addEventListener("mousedown", function(event) {

      if (event.button === 2 || event.button === 1) {
        event.preventDefault();

        const leftClickEvent = new MouseEvent("click", {
          bubbles: true,
          cancelable: true,
          view: window,
          detail: 1,
          screenX: event.screenX,
          screenY: event.screenY,
          clientX: event.clientX,
          clientY: event.clientY,
          ctrlKey: event.ctrlKey,
          altKey: event.altKey,
          shiftKey: event.shiftKey,
          metaKey: event.metaKey,
          button: 0,
          buttons: 1
        });

        event.target.dispatchEvent(leftClickEvent);
      }
    }, true);

    loadState();

  </script>
